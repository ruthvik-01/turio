name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run typecheck
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turio
          POSTGRES_PASSWORD: isolated-ci-fixture
          POSTGRES_DB: turio_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turio -d turio_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://turio:isolated-ci-fixture@127.0.0.1:5432/turio_test_ci
      TURIO_TEST_DATABASE_URL: postgresql+psycopg://turio:isolated-ci-fixture@127.0.0.1:5432/turio_test_ci
      SECRET_KEY: isolated-ci-fixture-only-not-a-production-secret
      OBJECT_STORAGE_ENDPOINT: http://object-storage.invalid:9000
      OBJECT_STORAGE_BUCKET: turio-test
      OBJECT_STORAGE_ACCESS_KEY: fixture-access
      OBJECT_STORAGE_SECRET_KEY: fixture-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python tests/run_postgres_suite.py
        working-directory: backend
  application-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURIO_UI_TEST: "1"
      TURIO_UI_APPLICATION_FIXTURE: "1"
      INTERNAL_API_BASE_URL: http://127.0.0.1:18081/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
      ANONYMIZED_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-browser.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Run isolated application workflow
        shell: bash
        run: |
          mkdir -p .runtime/ui-ci
          PYTHONPATH=backend:backend/tests python -m uvicorn ui_server:app --host 127.0.0.1 --port 18081 > .runtime/ui-ci/backend.log 2>&1 &
          backend_pid=$!
          npm --prefix frontend run start -- --hostname 127.0.0.1 --port 13001 > .runtime/ui-ci/frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$frontend_pid" "$backend_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json, time, urllib.error, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:13001/api/health/fixture", timeout=2) as response:
                      fixture = json.load(response)
                  assert fixture["fixture"] == "turio-disposable-ui" and fixture["application_fixture"]
                  break
              except urllib.error.URLError:
                  time.sleep(1)
          else:
              raise SystemExit("Disposable UI server did not become ready.")
          PY
          python scripts/smoke_ui.py --url http://127.0.0.1:13001 --application-fixture --output .runtime/ui-ci/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-application-ui
          path: .runtime/ui-ci/
  native-browser:
    runs-on: ubuntu-latest
    env:
      TURIO_BROWSER_TESTS: "1"
      ANONYMIZED_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-browser.txt
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_browser_adapter.py tests/test_native_submission.py tests/test_storage.py tests/test_agent_models.py -q
        working-directory: backend
