# Alembic configuration.
#
# The database URL is deliberately absent: `alembic/env.py` reads it from the
# application settings, so a migration can never target a different database
# than the running app.

[alembic]
script_location = alembic
# `.` covers the container layout (app package at /app/app); `backend` covers a
# checkout, where alembic/ sits at the repository root beside backend/.
prepend_sys_path = . backend
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
