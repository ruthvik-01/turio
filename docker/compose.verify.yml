# Isolated verification ports. Requires Compose >=2.24.4 for !override.
# Credentials come only from an ignored, per-run env file.
services:
  postgres:
    ports: !override
      - "127.0.0.1:18543:5432"
  object-storage:
    ports: !override
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
  backend:
    ports: !override
      - "127.0.0.1:18080:8000"
  frontend:
    ports: !override
      - "127.0.0.1:13000:3000"
